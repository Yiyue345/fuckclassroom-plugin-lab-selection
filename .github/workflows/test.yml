name: Test plugin

on:
  push:
    branches: ["main", "plugin-management"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: python -m pip install packaging

      - name: Validate manifest
        shell: python
        run: |
          import json
          from pathlib import Path
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          data = json.loads(Path("plugin.json").read_text(encoding="utf-8"))
          assert data["id"] == "lab_selection"
          assert data["api_version"] == 1
          assert data["entry"] == "plugin.py"
          assert data["requires"] == ["core_ui"]
          assert data["execution"] == "in_process"
          assert data["route_prefix"] is None
          assert data["rpc_api_version"] is None
          assert data["rpc_permissions"] == []
          assert data["python_requires"] == [{
              "requirement": "playwright>=1.45",
              "import": "playwright",
              "optional": False,
          }]

          current_host = Version("0.2.0.dev0")
          app_requires = SpecifierSet(data["app_requires"])
          assert app_requires.contains(current_host, prereleases=True), (
              f"plugin app_requires={data['app_requires']} rejects current "
              f"FuckClassroom {current_host}"
          )

      - name: Check Python syntax
        run: python -m compileall -q plugin.py client.py routes.py services.py waitlist.py scripts/build_registry_artifact.py

      - name: Check required plugin files
        shell: bash
        run: |
          test -f templates/lab_selection/index.html
          test -f static/lab_selection.css
          test -f static/lab_selection.js
          test -f docs/protocol.md

      - name: Smoke-build Registry v1 artifact
        shell: bash
        run: |
          python scripts/build_registry_artifact.py 0.1.0-ci.0
          sha256sum -c lab_selection-0.1.0-ci.0.zip.sha256
          python - <<'PY'
          import json
          import zipfile

          with zipfile.ZipFile("lab_selection-0.1.0-ci.0.zip") as archive:
              assert "plugin.json" in archive.namelist()
              assert "lab_selection/plugin.json" not in archive.namelist()
              manifest = json.loads(archive.read("plugin.json"))
              assert manifest["version"] == "0.1.0-ci.0"
          PY
